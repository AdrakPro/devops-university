---
# Baseline hardening for every VM: firewall on, SSH open, root login off.

# acl is needed by Ansible whenever it becomes an unprivileged user (the
# database role uses become_user: postgres).
- name: Ensure baseline packages are installed
  ansible.builtin.apt:
    name:
      - ufw
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

# Allow SSH *before* the default-deny policy so the play does not lock
# itself out of the machine.
- name: Allow SSH through the firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Deny incoming traffic by default and enable ufw
  community.general.ufw:
    policy: deny
    direction: incoming
    state: enabled

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*PermitRootLogin\s+.*$'
    line: "PermitRootLogin no"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload sshd
