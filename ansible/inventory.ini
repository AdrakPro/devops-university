# Static inventory — the only file with machine addresses.
#
# For your own environment, edit the three ansible_host values (and the key
# path below). Keep them in sync with the *_IP variables in ../Vagrantfile.
#
# Run ansible-playbook from this directory so the relative key path resolves:
#   cd ansible && ansible-playbook site.yml
# Any variable can be overridden at run time, e.g.:
#   ansible-playbook site.yml -e "db_password=change-me"

[all:vars]
ansible_user=vagrant
ansible_become=true
ansible_become_method=sudo
ansible_ssh_private_key_file=../keys/id_ed25519
ansible_python_interpreter=/usr/bin/python3

[database]
db ansible_host=192.168.56.10

[backend]
be ansible_host=192.168.56.11

[frontend]
fe ansible_host=192.168.56.12
